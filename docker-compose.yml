services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticketsupport
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=ticketsupport;Username=postgres;Password=${POSTGRES_PASSWORD}"
      DataProtection__KeysPath: /keys
    volumes:
      - dpkeys:/keys
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  dpkeys:
